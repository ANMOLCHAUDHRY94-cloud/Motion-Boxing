
name: Build Signed Android AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Upload Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/signing/upload-key.jks"

          test -s "$RUNNER_TEMP/signing/upload-key.jks"
          chmod 600 "$RUNNER_TEMP/signing/upload-key.jks"

      - name: Build Signed Release AAB
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/signing/upload-key.jks" \
            -Pandroid.injected.signing.store.password="$STORE_PASS" \
            -Pandroid.injected.signing.key.alias=upload \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Verify AAB Signature
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"

          test -s "$AAB"

          jarsigner -verify "$AAB" > verification.txt 2>&1

          grep -q "jar verified" verification.txt

          echo "AAB signature verification passed"

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: Real-Punch-Signed-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 1
