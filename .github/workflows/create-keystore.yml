
name: Create Upload Keystore

on:
  workflow_dispatch:

jobs:
  create-key:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate Keystore
        env:
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          keytool -genkeypair \
            -keystore upload-key.jks \
            -storetype PKCS12 \
            -alias upload \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -storepass:env STORE_PASS \
            -keypass:env KEY_PASS \
            -dname "CN=PA Gaming Studio, O=PA Gaming Studio, C=IN"

      - name: Save Keystore
        uses: actions/upload-artifact@v4
        with:
          name: upload-keystore-private
          path: upload-key.jks
          retention-days: 1
