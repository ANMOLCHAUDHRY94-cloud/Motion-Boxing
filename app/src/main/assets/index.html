*{box-sizing:border-box}body{margin:0;background:#080e1e;color:white;font-family:system-ui,Arial;overflow:hidden}button{font:700 15px system-ui;color:#fff;border:0;border-radius:12px;background:#2668e7;padding:13px;touch-action:manipulation}button:active{filter:brightness(1.4)}#menu{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:16px;background:radial-gradient(ellipse at 50% 20%,#20375b,#080e1e 70%);padding:18px;text-align:center}#menu h1{font-size:clamp(28px,7vw,52px);margin:0}#menu p{color:#bac6da;max-width:470px}#menu button{width:min(360px,90vw)}#game{display:none;position:absolute;inset:0;background:radial-gradient(ellipse at center,#2d405e,#101727 72%)}#arena{position:absolute;inset:68px 0 62px;overflow:hidden}#floor{position:absolute;bottom:0;width:100%;height:26%;background:linear-gradient(#45516c,#192234);border-top:3px solid #7c8ba8}#hud{position:absolute;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px;background:#08111ddd;z-index:3}.hp{width:32%;font-size:12px;font-weight:800}.track{height:13px;background:#4e1f2a;border-radius:12px;overflow:hidden;margin-top:5px}.fill{height:100%;width:100%;background:linear-gradient(90deg,#25dc86,#b9ef5c);transition:width .2s}#clock{font-size:23px;font-weight:900}#opponent{position:absolute;left:50%;bottom:8%;width:min(34vw,230px);height:80%;transform:translateX(-50%);transition:left .16s ease,transform .12s ease;--skin:#b77952;--shorts:#dc3e47}#opponent svg{height:100%;width:100%;overflow:visible;filter:drop-shadow(0 7px 9px #0007)}#opponent .skin{fill:var(--skin)}#opponent .shorts{fill:var(--shorts)}#opponent .glove{fill:#db3745;stroke:#811b2b;stroke-width:3}#opponent .boot{fill:#191d31}#opponent .hair{fill:#14111c}#opponent.dodging{filter:brightness(1.2)}#opponent.hit{filter:brightness(1.8)}#opponent.attack .rightglove{transform:translate(-18px,10px) scale(1.18);transform-origin:90px </style></head><body><section id="menu"><h1>🥊 MOTION BOXING 4.0</h1><p>Fight a full-body opponent with real punches and head movement.</p><button id="one">ONE-HAND BOXING<br><small>Portrait · Hold phone in left hand · Right punches</small></button><button id="two">TWO-HAND BOXING<br><small>Landscape · Phone on stand · Both hands</small></button><p>Keep your face and punching arm(s) in camera view. Good lighting and a stable phone improve tracking. Camera access and internet are required on first launch.</p></section><section id="game"><div id="hud"><div class="hp">YOU<div class="track"><div class="fill" id="playerHp"></div></div></div><div id="clock">01:30</div><div class="hp" style="text-align:right">OPPONENT<div class="track"><div class="fill" id="enemyHp"></div></div></div></div><div id="debug">TRACKER: STARTING</div><div id="arena"><div id="floor"></div><div id="opponent"><svg viewBox="0 0 200 330" preserveAspectRatio="xMidYMax meet" aria-label="Full body boxer"><path class="boot" d="M63 295L90 296 92 321 47 321Q42 311 63 295ZM116 296L140 294 160 320 115 321Z"/><path class="skin" d="M70 206L96 207 89 302 64 302ZM106 207L132 206 139 301 114 302Z"/><path class="shorts" d="M67 180H134L140 230 104 230 100 211 94 230 59 230Z"/><path class="skin" d="M77 77Q101 67 124 77L137 182Q100 197 64 182Z"/><path class="skin" d="M75 90L58 100 40 155 55 166 78 119ZM124 91L143 100 163 155 148 166 122 120Z"/><path class="skin" d="M89 62H112V89H89Z"/><ellipse class="skin" cx="101" cy="43" rx="30" ry="38"/><path class="hair" d="M70 37Q66 0 102 5Q138 5 131 36Q115 22 100 28Q85 22 70 37Z"/><path d="M88 48h6m16 0h6" stroke="#1b1520" stroke-width="3" stroke-linecap="round"/><path d="M94 65q8 6 16 0" stroke="#4c2b2a" stroke-width="2" fill="none"/><path class="glove leftglove" d="M44 137Q25 128 19 146Q12 168 31 178Q51 185 63 163L59 145Z"/><path class="glove rightglove" d="M151 137Q171 126 182 146Q191 166 171 178Q149 185 140 162L144 145Z"/><path d="M65 181H135" stroke="#f9d46e" stroke-width="8"/></svg></div><div id="message"></div></div><video id="camera" autoplay muted playsinline></video><div id="status"><span id="help">Starting camera…</span><button id="dodgeL">DODGE ◀</button><button id="dodgeR">DODGE ▶</button><button id="duck">DUCK</button><button id="exit">MENU</button></div></section><div id="overlay"><h2 id="result"></h2><p id="resultDetail"></p><button id="again">PLAY AGAIN</button><button id="back">MAIN MENU</button></div><script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5/pose.js"></script><script>
'use strict';const $=x=>document.getElementById(x);let mode='',pose=null,stream=null,run=false,frameBusy=false,lastFrame=0,raf=0,enemyTimer=0,gameTimer=0,attackTimer=0,clearMsg=0,player=100,enemy=100,seconds=90,score=0,combo=0,warning=null,lastDodge=0,headBase=null,lastHead=null,headReady=false,lastPunch={left:0,right:0},arms={left:{ready:true,prev:null},right:{ready:true,prev:null}},lastCounter=0,enemySide=0,trackedFrames=0,frameTick=0;const video=$('camera');const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));function msg(s,t=700){$('message').textContent=s;clearTimeout(clearMsg);clearMsg=setTimeout(()=>{$('message').textContent=''},t)}function hp(){$('playerHp').style.width=player+'%';$('enemyHp').style.width=enemy+'%'}function setOrientation(o){try{if(window.Android&&typeof Android.setOrientation==='function'){Android.setOrientation(o);return true;}if(screen.orientation&&screen.orientation.lock&&o!=='unspecified'){screen.orientation.lock(o==='portrait'?'portrait':'landscape').catch(()=>{});return true}}catch(e){console.error(e)}return false}function reset(){player=100;enemy=100;seconds=90;score=0;combo=0;warning=null;headBase=null;lastHead=null;headReady=false;lastPunch={left:0,right:0};arms={left:{ready:true,prev:null,peak:0},right:{ready:true,prev:null,peak:0}};trackedFrames=0;frameTick=0;hp();$('clock').textContent='01:30';$('opponent').className='';$('opponent').style.left='50%';$('overlay').style.display='none'}async function start(m){stop();mode=m;reset();setOrientation(m==='one'?'portrait':'landscape');$('menu').style.display='none';$('game').style.display='block';run=true;$('debug').textContent='MODE: '+(m==='one'?'PORTRAIT':'LANDSCAPE')+' | WAITING FOR CAMERA';$('help').textContent='Allow camera access';try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'user',width:{ideal:640},height:{ideal:480}}});video.srcObject=stream;await video.play();if(!window.Pose)throw Error('Pose tracker could not load. Connect to internet.');pose=new Pose({locateFile:f=>'https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5/'+f});pose.setOptions({modelComplexity:0,smoothLandmarks:true,minDetectionConfidence:.5,minTrackingConfidence:.45});pose.onResults(onPose);$('help').textContent='Move your head to dodge · Punch toward camera';raf=requestAnimationFrame(loop);enemyTimer=setTimeout(enemyAttack,2200);gameTimer=setInterval(()=>{if(!run)return;seconds--;let mm=String(Math.floor(seconds/60)).padStart(2,'0'),ss=String(seconds%60).padStart(2,'0');$('clock').textContent=mm+':'+ss;if(seconds<=0)finish()},1000);msg('FIGHT!',1100)}catch(e){$('help').textContent='Camera error: '+e.message;msg('CAMERA UNAVAILABLE',1800)}}function stop(){run=false;clearTimeout(enemyTimer);clearTimeout(attackTimer);clearInterval(gameTimer);cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}video.srcObject=null;if(pose){try{pose.close()}catch(e){}pose=null}}function exit(){stop();setOrientation('unspecified');$('overlay').style.display='none';$('game').style.display='none';$('menu').style.display='flex'}async function loop(t){if(!run)return;raf=requestAnimationFrame(loop);if(frameBusy||!pose||video.readyState<2||t-lastFrame<65)return;frameBusy=true;lastFrame=t;try{await pose.send({image:video})}catch(e){$('help').textContent='Tracking error: '+e.message}finally{frameBusy=false}}function visible(p){return p&&p.visibility!==undefined?p.visibility>.48:!!p}function angle(a,b,c){let x=a.x-b.x,y=a.y-b.y,u=c.x-b.x,v=c.y-b.y;return Math.acos(clamp((x*u+y*v)/(Math.hypot(x,y)*Math.hypot(u,v)||1),-1,1))*180/Math.PI}function onPose(r){if(!run)return;let p=r.poseLandmarks;if(!p){$('help').textContent='Move back: show face and arms';$('debug').textContent='NO BODY FOUND | Move back / improve light';return}let nose=p[0],ls=p[11],rs=p[12];if(visible(nose)&&visible(ls)&&visible(rs)){let shoulderWidth=Math.max(.09,Math.hypot(ls.x-rs.x,ls.y-rs.y));let mid=(ls.x+rs.x)/2;let headX=(nose.x-mid)/shoulderWidth;let headY=(nose.y-(ls.y+rs.y)/2)/shoulderWidth;if(!headReady){headBase={x:headX,y:headY};headReady=true}else{let now=performance.now();let dx=headX-headBase.x,dy=headY-headBase.y; // Mirrored front-camera image: negate horizontal motion for intuitive left/right.
if(now-lastDodge>440){if(dx<-.23){dodge('left');lastDodge=now}else if(dx>.23){dodge('right');lastDodge=now}else if(dy>.30){dodge('duck');lastDodge=now}}if(Math.abs(dx)<.16&&Math.abs(dy)<.17){headBase.x=headBase.x*.996+headX*.004;headBase.y=headBase.y*.996+headY*.004}lastHead={x:dx,y:dy};} }
let debugParts=[];
for(let side of (mode==='one'?['right']:['left','right'])){
  const ids=side==='left'?[11,13,15]:[12,14,16];
  const a=p[ids[0]],b=p[ids[1]],c=p[ids[2]],st=arms[side];
  if(!visible(a)||!visible(c)){st.prev=null;debugParts.push(side.toUpperCase()+': NOT VISIBLE');continue}
  const now=performance.now();
  const sw=Math.max(.085,Math.hypot(ls.x-rs.x,ls.y-rs.y));
  const reach=Math.hypot(c.x-a.x,c.y-a.y)/sw;
  const bend=visible(b)?angle(a,b,c):125;
  const dt=st.prev?Math.max(.03,(now-st.prev.t)/1000):.07;
  const velocity=st.prev?Math.hypot(c.x-st.prev.x,c.y-st.prev.y)/sw/dt:0;
  const extension=st.prev?(reach-st.prev.reach):0;
  const forward=st.prev?Math.abs(c.x-st.prev.x)/sw:0;
  // Accept a clear extension OR a fast wrist thrust, not only a fully straight elbow.
  const thrust=(extension>.065&&bend>92)||(velocity>1.15&&reach>.49&&bend>95)||(forward>.14&&bend>120);
  if(st.ready&&thrust&&reach>.47&&now-lastPunch[side]>330){st.ready=false;lastPunch[side]=now;punch(side)}
  // Rearm on arm withdrawal; timeout also permits repeated jabs when depth isn't visible.
  if((st.prev&&reach<st.prev.reach-.055)||bend<102||now-lastPunch[side]>900)st.ready=true;
  st.prev={x:c.x,y:c.y,reach,t:now};
  debugParts.push(side.toUpperCase()+': '+(st.ready?'READY':'PUNCH')+' '+Math.round(reach*100)+'%');
}
if(performance.now()-frameTick>200){frameTick=performance.now();$('debug').textContent='CAMERA TRACKING | '+debugParts.join(' | ');}
$('help').textContent=mode==='one'?'RIGHT PUNCH · HEAD DODGE':'BOTH HANDS · HEAD DODGE';}function punch(side){if(!run)return;let now=performance.now();if(warning&&now<warning.impact){ // attacking during windup is allowed
}let dodges=Math.random()<.27;let el=$('opponent');if(dodges){let dir=Math.random()<.5?-1:1;enemySide=clamp(enemySide+dir*11,-22,22);el.style.left=(50+enemySide)+'%';el.classList.add('dodging');msg('OPPONENT DODGED!',550);setTimeout(()=>el.classList.remove('dodging'),300);combo=0;return}let damage=mode==='one'?9:7;if(now-lastCounter<1700)damage+=4;enemy=clamp(enemy-damage,0,100);score+=damage;combo++;hp();el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),160);msg((side==='left'?'LEFT':'RIGHT')+' HIT!'+(combo>1?' COMBO x'+combo:''),440);if(enemy<=0)finish()}function dodge(direction){if(!run||!warning)return;let now=performance.now();if(now>warning.impact||now<warning.impact-1100)return;if(direction===warning.direction||(direction==='duck'&&warning.kind==='hook')){warning.dodged=true;lastCounter=now;score+=5;msg('PERFECT DODGE! +5',600)}else{msg('WRONG DIRECTION!',450)}}function enemyAttack(){if(!run)return;let direction=Math.random()<.5?'left':'right';let kind=Math.random()<.25?'hook':'straight';let delay=950;warning={direction,kind,impact:performance.now()+delay,dodged:false};msg((direction==='left'?'LEFT':'RIGHT')+' '+(kind==='hook'?'HOOK':'PUNCH')+'! DODGE '+direction.toUpperCase(),delay-100);attackTimer=setTimeout(()=>{if(!run)return;let w=warning;warning=null;$('opponent').classList.add('attack');setTimeout(()=>$('opponent').classList.remove('attack'),260);if(w&&!w.dodged){let damage=kind==='hook'?13:10;player=clamp(player-damage,0,100);hp();combo=0;msg('YOU WERE HIT! -'+damage,650);if(player<=0){finish();return}}else msg('MISSED!',420);enemyTimer=setTimeout(enemyAttack,1400+Math.random()*950)},delay)}function finish(){if(!run)return;let won=enemy<=0||(seconds<=0&&player>=enemy);let title=enemy<=0?'KNOCKOUT!':player<=0?'YOU WERE KNOCKED OUT':won?'YOU WIN!':'YOU LOSE';if(enemy<=0)$('opponent').classList.add('ko');stop();$('result').textContent=title;$('resultDetail').textContent='Your Health: '+player+'% · Opponent Health: '+enemy+'% · Score: '+score;$('overlay').style.display='flex'}$('one').onclick=()=>start('one');$('two').onclick=()=>start('two');$('exit').onclick=exit;$('back').onclick=exit;$('again').onclick=()=>start(mode);$('dodgeL').onclick=()=>dodge('left');$('dodgeR').onclick=()=>dodge('right');$('duck').onclick=()=>dodge('duck');document.addEventListener('visibilitychange',()=>{if(document.hidden&&run){msg('PAUSED - RETURN TO GAME',2000)}});
