<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion Boxing 3.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10182d;color:white;font-family:Arial;text-align:center}
header{padding:12px;background:#1b2947}
h1{font-size:24px;margin:8px}
.stats{display:flex;justify-content:space-around;padding:8px;font-weight:bold}
.bar{height:14px;background:#444;margin:7px 15px;border-radius:10px;overflow:hidden}
.fill{height:100%;width:100%;transition:width .2s}
#playerHP{background:#26db85}
#enemyHP{background:#ff4268}
#arena{position:relative;height:55vh;min-height:330px;overflow:hidden;background:radial-gradient(#344e80,#10182d)}
#fighter{position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);width:200px;height:260px;transition:transform .15s}
.head{position:absolute;top:10px;left:48px;width:110px;height:125px;background:#db986b;border-radius:45%;border:5px solid #643a32}
.hair{position:absolute;top:4px;left:42px;width:122px;height:42px;background:#25202b;border-radius:60% 60% 20% 20%}
.eyes{position:absolute;top:70px;left:73px;font-size:28px;color:#221821}
.body{position:absolute;top:135px;left:35px;width:135px;height:120px;background:#d52149;border-radius:35% 35% 10% 10%}
.glove{position:absolute;top:150px;width:72px;height:85px;background:#f53155;border:4px solid #8c1234;border-radius:45%;font-size:36px;padding-top:17px}
#leftGlove{left:0}
#rightGlove{right:0}
#video{position:absolute;right:8px;bottom:8px;width:110px;height:145px;object-fit:cover;transform:scaleX(-1);border:2px solid white;border-radius:10px}
#impact{position:absolute;top:20%;left:40%;font-size:35px;color:yellow;font-weight:bold;display:none}
#enemyAction{position:absolute;top:15px;left:10px;color:#ff7890;font-weight:bold;display:none}
#overlay{position:absolute;inset:0;background:#080d1bd9;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:3}
button{background:#fa3764;color:white;border:0;padding:14px;border-radius:12px;font-size:16px;font-weight:bold;margin:5px}
#status{padding:12px;color:#ffdf8b;font-size:13px}
small{display:block;padding:10px;color:#bdc9e0}
</style>
</head>
<body>

<header>
<h1>🥊 MOTION BOXING 3.0</h1>
<div class="stats">
<span id="playerText">YOU: 100</span>
<span id="score">SCORE: 0</span>
<span id="timer">60s</span>
</div>
<div class="bar"><div class="fill" id="playerHP"></div></div>
<div class="bar"><div class="fill" id="enemyHP"></div></div>
</header>

<div id="arena">
<div id="enemyAction">👊 ENEMY ATTACK!</div>
<div id="impact">💥 PUNCH!</div>
<div id="fighter">
<div class="body"></div>
<div class="head"></div>
<div class="hair"></div>
<div class="eyes">⌄ ⌄</div>
<div class="glove" id="leftGlove">🥊</div>
<div class="glove" id="rightGlove">🥊</div>
</div>
<video id="video" autoplay muted playsinline></video>
<div id="overlay">
<h1 id="result">READY TO FIGHT?</h1>
<p>बाएँ हाथ में फोन, दाएँ हाथ से पंच!</p>
<button onclick="startGame()">START GAME</button>
</div>
</div>

<button onclick="cameraMode()">📷 CAMERA MODE</button>
<button onclick="touchMode()">👆 TOUCH DEMO</button>
<button onclick="startGame()">↻ RESTART</button>
<div id="status">कैमरा चालू करके दायाँ हाथ दिखाएँ।</div>
<small>दायाँ कंधा, कोहनी और कलाई कैमरे में रखें। इंटरनेट आवश्यक है।</small>

<script>
const el=id=>document.getElementById(id);
let hp=100,enemy=100,score=0,time=60;
let active=false,mode="touch",timerID,attackID;
let pose=null,stream=null,busy=false,tracking=false;
let history=[],armed=false,guardStart=0,lastPunch=0;
let lastEnemy=0,attackAt=0;

function status(t){el("status").textContent=t}

function draw(){
 el("playerHP").style.width=hp+"%";
 el("enemyHP").style.width=enemy+"%";
 el("playerText").textContent="YOU: "+hp;
 el("score").textContent="SCORE: "+score;
 el("timer").textContent=time+"s";
}

function stop(){
 active=false;
 clearInterval(timerID);
 clearTimeout(attackID);
}

function finish(message){
 stop();
 el("result").textContent=message;
 el("overlay").style.display="flex";
}

function startGame(){
 stop();
 hp=100;enemy=100;score=0;time=60;
 history=[];armed=false;guardStart=0;
 lastPunch=0;attackAt=0;
 active=true;
 el("overlay").style.display="none";
 draw();
 timerID=setInterval(()=>{
  if(!active)return;
  time--;
  draw();
  if(time<=0){
   finish(enemy<hp?"🏆 YOU WIN!":"⏰ TIME UP");
  }
 },1000);
 scheduleEnemy();
}

function scheduleEnemy(){
 clearTimeout(attackID);
 if(active){
  attackID=setTimeout(enemyAttack,1600+Math.random()*1700);
 }
}

function enemyAttack(){
 if(!active)return;
 const now=performance.now();
 lastEnemy=now;
 el("enemyAction").style.display="block";
 el("leftGlove").style.transform="translate(35px,-40px)";
 el("arena").style.boxShadow="inset 0 0 70px red";
 setTimeout(()=>{
  el("enemyAction").style.display="none";
  el("leftGlove").style.transform="";
  el("arena").style.boxShadow="";
 },350);

 if(now-attackAt>800 && Math.random()<.82){
  hp=Math.max(0,hp-8);
  if(navigator.vibrate)navigator.vibrate(60);
 }
 draw();
 if(hp===0){
  finish("💀 YOU LOSE!");
  return;
 }
 scheduleEnemy();
}

function punch(){
 if(!active)return;
 const now=performance.now();
 if(now-lastPunch<650)return;
 lastPunch=now;
 enemy=Math.max(0,enemy-10);
 score+=10;
 el("impact").style.display="block";
 el("fighter").style.transform="translate(-50%,-50%) rotate(10deg)";
 setTimeout(()=>{
  el("impact").style.display="none";
  el("fighter").style.transform="translate(-50%,-50%)";
 },180);
 if(navigator.vibrate)navigator.vibrate(25);
 draw();
 if(enemy===0)finish("🏆 KNOCKOUT!");
}

el("arena").addEventListener("pointerdown",e=>{
 if(mode==="touch" && active && e.target.closest("#overlay")===null){
  punch();
 }
});

function touchMode(){
 mode="touch";
 startGame();
 status("टच डेमो चालू है। बॉक्सर पर टैप करें।");
}

function angle(a,b,c){
 let ux=a.x-b.x,uy=a.y-b.y;
 let vx=c.x-b.x,vy=c.y-b.y;
 let dot=ux*vx+uy*vy;
 let length=Math.hypot(ux,uy)*Math.hypot(vx,vy);
 return Math.acos(Math.max(-1,Math.min(1,dot/(length+0.00001))))*180/Math.PI;
}

function detect(results){
 if(mode!=="camera"||!active)return;
 const lm=results.poseLandmarks;
 const now=performance.now();

 if(!lm||[11,12,14,16].some(i=>(lm[i].visibility??1)<.55)){
  history=[];armed=false;guardStart=0;
  status("दायाँ कंधा, कोहनी और कलाई कैमरे में दिखाएँ।");
  return;
 }

 const shoulder=lm[12],elbow=lm[14],wrist=lm[16];
 const scale=Math.max(.08,Math.hypot(
  shoulder.x-lm[11].x,shoulder.y-lm[11].y
 ));
 const x=(wrist.x-shoulder.x)/scale;
 const y=(wrist.y-shoulder.y)/scale;
 const extension=angle(shoulder,elbow,wrist);
 const distance=Math.hypot(x,y);

 history.push({t:now,x,y,extension,distance});
 history=history.filter(p=>now-p.t<480);

 if(extension<118&&distance<3.1){
  if(!guardStart)guardStart=now;
  if(now-guardStart>120)armed=true;
 }else if(extension>145){
  guardStart=0;
 }

 const old=history.find(p=>now-p.t>=110&&now-p.t<=360);
 if(!old)return;

 const dt=(now-old.t)/1000;
 const speed=Math.hypot(x-old.x,y-old.y)/dt;
 const extGain=extension-old.extension;
 const distGain=distance-old.distance;

 if(armed&&now-lastPunch>650&&extension>145&&
    extGain>20&&distGain>.4&&speed>2.5){
  armed=false;
  guardStart=0;
  history=[];
  punch();
 }

 if(now-lastEnemy<500&&Math.abs(x-old.x)>1.1){
  attackAt=now;
 }
}

function loadPose(){
 return new Promise((resolve,reject)=>{
  if(window.Pose){resolve();return}
  const script=document.createElement("script");
  script.src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5/pose.js";
  script.onload=resolve;
  script.onerror=()=>reject(new Error("Tracking library load failed"));
  document.head.appendChild(script);
 });
}

async function cameraMode(){
 try{
  if(!window.isSecureContext){
   status("कैमरे के लिए सुरक्षित HTTPS origin जरूरी है।");
   return;
  }
  if(!navigator.mediaDevices?.getUserMedia){
   status("इस Android WebView में कैमरा उपलब्ध नहीं है।");
   return;
  }
  status("कैमरा चालू हो रहा है...");
  if(!stream){
   stream=await navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{facingMode:"user",width:640,height:480}
   });
  }
  el("video").srcObject=stream;
  await el("video").play();

  status("Hand tracking लोड हो रही है...");
  await loadPose();

  if(!pose){
   pose=new Pose({
    locateFile:f=>"https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5/"+f
   });
   pose.setOptions({
    modelComplexity:0,
    smoothLandmarks:true,
    minDetectionConfidence:.65,
    minTrackingConfidence:.65
   });
   pose.onResults(detect);
  }

  mode="camera";
  startGame();
  status("👊 दायाँ हाथ पीछे लेकर तेज़ पंच करें।");

  if(!tracking){
   tracking=true;
   requestAnimationFrame(track);
  }
 }catch(e){
  status("Camera error: "+e.message);
 }
}

async function track(){
 if(mode==="camera"&&stream&&pose&&!busy&&
    el("video").readyState>=2){
  busy=true;
  try{
   await pose.send({image:el("video")});
  }catch(e){
   status("Tracking error: "+e.message);
   mode="touch";
  }finally{
   busy=false;
  }
 }
 requestAnimationFrame(track);
}

draw();
</script>
</body>
</html>
