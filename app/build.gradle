plugins {
    id 'com.android.application'
}

android {
    namespace 'com.motionboxing.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.motionboxing.game'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:24.6.0'
}














