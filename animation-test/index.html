<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion Boxing — Boxer Load</title>
<style>body{margin:0;background:#101723;color:white;font:16px system-ui;text-align:center}h2{margin:14px 0}#stage{height:75vh;width:100%}#status{color:#ffd476;padding:10px;overflow-wrap:anywhere}button{background:#df303c;color:white;border:0;border-radius:9px;padding:12px 20px}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script>
</head><body><h2>🥊 Motion Boxing — Boxer</h2><div id="status">Loading boxer…</div><div id="stage"></div><button onclick="location.reload()">Reload</button>
<script type="module">
const status=document.getElementById('status');
window.addEventListener('error',e=>status.textContent='JavaScript error: '+e.message);
window.addEventListener('unhandledrejection',e=>status.textContent='Error: '+String(e.reason));
try {
const THREE=await import('three');
const {GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js');
const stage=document.getElementById('stage');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101723);
const camera=new THREE.PerspectiveCamera(40,stage.clientWidth/Math.max(stage.clientHeight,1),0.01,100);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(stage.clientWidth,stage.clientHeight);stage.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x667788,2.5));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(3,5,7);scene.add(light);
status.textContent='Loading boxer.glb…';
const gltf=await new GLTFLoader().loadAsync('./boxer.glb');
const boxer=gltf.scene;scene.add(boxer);
// Original character's geometry uses Z as vertical, as in the game.
boxer.rotation.x=-Math.PI/2;boxer.rotation.y=Math.PI;
boxer.updateMatrixWorld(true);
let bounds=new THREE.Box3().setFromObject(boxer);
if(bounds.isEmpty())throw new Error('Model geometry is empty');
const center=bounds.getCenter(new THREE.Vector3());const size=bounds.getSize(new THREE.Vector3());
const maxDim=Math.max(size.x,size.y,size.z);
boxer.scale.multiplyScalar(3.5/maxDim);
boxer.position.sub(center.multiplyScalar(3.5/maxDim));
boxer.updateMatrixWorld(true);
bounds=new THREE.Box3().setFromObject(boxer);
const fittedCenter=bounds.getCenter(new THREE.Vector3());
camera.position.copy(fittedCenter).add(new THREE.Vector3(0,0,Math.max(5.5,bounds.getSize(new THREE.Vector3()).length()*1.4)));
camera.lookAt(fittedCenter);
status.textContent='✓ Boxer loaded!';
function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)}animate();
window.addEventListener('resize',()=>{camera.aspect=stage.clientWidth/Math.max(stage.clientHeight,1);camera.updateProjectionMatrix();renderer.setSize(stage.clientWidth,stage.clientHeight)});
} catch(e){status.textContent='Loading failed: '+(e?.message||String(e));}
</script></body></html>
